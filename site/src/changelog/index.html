<!doctype html>
<html lang="en">
<head>
<!--#include head -->
<title>Changelog · Wecra</title>
<meta name="description" content="What's new in each Wecra release." />
<script type="module" src="/scripts/pages/changelog.ts"></script>
</head>
<body>
<!--#include dock -->
<main id="main" class="sheets">
  <section class="sheet sheet-top" data-tone="mint" aria-labelledby="changelog-title">
    <div class="sheet-copy">
      <div class="sheet-head" data-reveal>
        <p class="label muted">Changelog</p>
        <h1 class="sheet-display" id="changelog-title">What’s new.</h1>
      </div>
      <div class="sheet-side" data-reveal style="--reveal-delay: 120ms">
        <p class="lede muted">Every release of Wecra, newest first. Installed copies update themselves.</p>
      </div>
    </div>
  </section>

  <section class="sheet sheet-text" data-tone="plain" aria-label="Releases">
    <div data-releases aria-busy="true">
      <p class="state">Loading releases…</p>
    </div>
  </section>
</main>
<!--#include footer -->
</body>
</html>
