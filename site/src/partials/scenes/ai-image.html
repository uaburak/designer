<div class="scene scene-wide" data-scene="ai-image" role="img" aria-label="Make an image: a prompt is typed and the picture appears in place; then its background is removed and it is vectorized.">
<svg viewBox="0 0 640 420" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="ai-clip"><rect x="180" y="50" width="280" height="210" /></clipPath>
    <pattern id="ai-checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff" /><rect width="8" height="8" fill="#e8e8ea" /><rect x="8" y="8" width="8" height="8" fill="#e8e8ea" /></pattern>
    <linearGradient id="ai-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d0ff" /><stop offset="1" stop-color="#5b93ec" /></linearGradient>
    <linearGradient id="ai-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d74d6" /><stop offset="1" stop-color="#2a55ad" /></linearGradient>
    <radialGradient id="ai-lemon" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#fff6b8" /><stop offset=".45" stop-color="#ffd83a" /><stop offset="1" stop-color="#e3a10a" /></radialGradient>
    <radialGradient id="ai-light" cx=".25" cy=".1" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".7" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></radialGradient>
    <linearGradient id="ai-shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".55" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
    <filter id="ai-shadow" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".16" /></filter>
    <path id="ai-lemon-shape" d="M-80 0C-74-4-68-10-64-18C-52-40-28-50 0-50C28-50 52-40 64-18C68-10 74-4 80 0C74 4 68 10 64 18C52 40 28 50 0 50C-28 50-52 40-64 18C-68 10-74 4-80 0Z" />
  </defs>
  <g data-k="doc">
    <g clip-path="url(#ai-clip)">
      <rect x="180" y="50" width="280" height="210" class="fd" />
      <use data-k="placeholder" data-off href="#i-image" x="296" y="131" width="48" height="48" class="ic2" />
      <g data-k="shimmer" data-off><rect x="100" y="50" width="120" height="210" fill="url(#ai-shimmer)" /></g>
      <g data-k="photo">
        <rect x="180" y="50" width="280" height="210" fill="url(#ai-checker)" />
        <g data-k="bg" data-off>
          <rect x="180" y="50" width="280" height="150" fill="url(#ai-wall)" />
          <rect x="180" y="196" width="280" height="64" fill="url(#ai-table)" />
          <rect x="180" y="50" width="280" height="210" fill="url(#ai-light)" />
          <ellipse cx="332" cy="214" rx="74" ry="10" fill="#0b1f4d" fill-opacity=".35" />
        </g>
        <g transform="translate(320 160) rotate(-12)">
          <g data-k="raster" data-off>
            <use href="#ai-lemon-shape" fill="url(#ai-lemon)" />
            <ellipse cx="-20" cy="-26" rx="24" ry="8" fill="#fff" fill-opacity=".45" />
            <path d="M18-48C30-70 58-74 72-66C62-52 40-45 18-48Z" fill="#4caf50" />
          </g>
          <g data-k="vector">
            <use href="#ai-lemon-shape" fill="#ffd23f" />
            <path d="M-64 18C-52 40-28 50 0 50C28 50 52 40 64 18C40 30-40 30-64 18Z" fill="#f2b705" />
            <ellipse cx="-18" cy="-27" rx="20" ry="6" fill="#fff3b0" />
            <path d="M18-48C30-70 58-74 72-66C62-52 40-45 18-48Z" fill="#3fae5a" />
            <use href="#ai-lemon-shape" fill="none" class="brs" stroke-width="1" />
            <g fill="#fff" class="brs" stroke-width="1.2">
              <circle data-k="v" cx="-80" cy="0" r="3.2" /><circle data-k="v" cx="-64" cy="-18" r="3.2" /><circle data-k="v" cx="0" cy="-50" r="3.2" /><circle data-k="v" cx="64" cy="-18" r="3.2" />
              <circle data-k="v" cx="80" cy="0" r="3.2" /><circle data-k="v" cx="64" cy="18" r="3.2" /><circle data-k="v" cx="0" cy="50" r="3.2" /><circle data-k="v" cx="-64" cy="18" r="3.2" />
            </g>
          </g>
        </g>
      </g>
      <g data-k="tiles"></g>
    </g>
    <rect x="180" y="50" width="280" height="210" fill="none" class="brs" stroke-width="1.5" data-k="imgSel" />

    <!-- The image's toolbar -->
    <g data-k="imgBar">
      <rect x="186" y="8" width="268" height="32" rx="9" class="bg" filter="url(#ai-shadow)" />
      <rect data-k="rbHi" data-off x="192" y="12" width="138" height="24" rx="6" class="sel" />
      <text x="261" y="28" text-anchor="middle" class="tx t1">Remove background</text>
      <rect data-k="vzHi" data-off x="336" y="12" width="112" height="24" rx="6" class="sel" />
      <text x="392" y="28" text-anchor="middle" class="tx t1">Vectorize</text>
    </g>

    <!-- Make an image -->
    <g data-k="prompt" data-off>
      <rect x="150" y="282" width="340" height="104" rx="13" class="bg" filter="url(#ai-shadow)" />
      <use href="#i-sparkle" x="162" y="292" width="20" height="20" class="icc" />
      <text x="188" y="306" class="tx tx-strong t1">Make an image</text>
      <text x="166" y="338" class="tx-m t3" data-k="ph">Describe an image…</text>
      <text x="166" y="338" class="tx-m t1">A lemon on a blue table, soft light</text>
      <g data-k="cover"><rect x="164" y="320" width="300" height="26" class="bg" /><rect x="164" y="324" width="1.5" height="18" class="br" /></g>
      <rect x="166" y="356" width="92" height="20" rx="5" class="fd" /><text x="174" y="370" class="tx t2">Model: Auto</text>
      <g transform="translate(466 364)"><g data-k="send"><circle r="13" class="br" /><use href="#i-send" x="-10" y="-10" width="20" height="20" class="icw" /></g></g>
    </g>
  </g>
  <g data-k="cur" style="transform: translate(420px, 300px)">
    <use href="#i-cursor" x="-2.5" y="-2.2" width="20" height="22" fill="#1e1e1e" />
  </g>
</svg>
</div>
