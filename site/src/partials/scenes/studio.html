<div class="scene scene-wide" data-scene="studio" role="img" aria-label="Studio: the manager splits a request into three tasks for different agents, a post and a story appear on the canvas, and the manager asks before fixing an issue.">

    <text data-k="plan" x="28" y="134" class="tx t1">Three tasks, from the brand's library:</text>

    <g data-k="t3">

      <rect data-k="b3" class="ol br" x="60" y="292" width="200" height="4" rx="2" />

    <g data-k="review">
      <text x="28" y="334" class="tx t1">1 issue: small text on the story.</text>
      <text x="28" y="350" class="tx t1">Shall I fix this?</text>

      <rect x="492" y="238" width="60" height="8" rx="4" fill="#fff" fill-opacity=".75" data-k="storyText" />

  <g data-k="cur" style="transform: translate(200px, 400px)">
    <use href="#i-cursor" x="-2.5" y="-2.2" width="20" height="22" fill="#1e1e1e" />
