<div class="scene scene-wide" data-scene="libraries" role="img" aria-label="A library's primary colour is changed and published; two files receive the update and accept it.">
<svg viewBox="0 0 640 420" aria-hidden="true" focusable="false">
  <defs>
    <filter id="lb-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity=".12" /></filter>
    <g id="lb-preview-old"><rect x="16" y="36" width="168" height="60" fill="#fff" /><rect x="28" y="53" width="88" height="26" rx="7" fill="#0d99ff" /><rect x="40" y="63" width="44" height="6" rx="3" fill="#fff" /><circle cx="152" cy="66" r="11" fill="#0d99ff" /></g>
    <g id="lb-preview-new"><rect x="28" y="53" width="88" height="26" rx="7" fill="#9747ff" /><rect x="40" y="63" width="44" height="6" rx="3" fill="#fff" /><circle cx="152" cy="66" r="11" fill="#9747ff" /></g>
  </defs>
  <g data-k="doc">
    <!-- Paths between the files -->
    <g fill="none" stroke-width="2" class="ln" stroke-dasharray="4 5">
      <path d="M240 210C320 210 320 120 400 120" /><path d="M240 210C320 210 320 300 400 300" />
    </g>
    <g fill="none" class="brs" stroke-width="3.5" stroke-linecap="round">
      <path data-k="pk1" data-off d="M240 210C320 210 320 120 400 120" />
      <path data-k="pk2" data-off d="M240 210C320 210 320 300 400 300" />
    </g>

    <!-- The library -->
    <rect x="40" y="80" width="200" height="260" rx="14" class="bg" filter="url(#lb-shadow)" />
    <text x="56" y="108" class="tx tx-strong t1">Design system</text>
    <text x="56" y="124" class="tx t2">Library</text>
    <text x="56" y="152" class="tx t2">Colors</text>
    <circle cx="68" cy="170" r="10" fill="#0d99ff" /><circle cx="96" cy="170" r="10" fill="#14ae5c" /><circle cx="124" cy="170" r="10" fill="#ffcd29" /><circle cx="152" cy="170" r="10" fill="#f24822" />
    <text x="56" y="206" class="tx t2">Components</text>
    <rect x="56" y="216" width="112" height="30" rx="8" fill="#0d99ff" /><text x="112" y="235" text-anchor="middle" class="tx tx-strong tw">Button</text>
    <rect x="182" y="222" width="34" height="18" rx="9" fill="#0d99ff" /><circle cx="207" cy="231" r="7" fill="#fff" />
    <g data-k="libNew">
      <circle cx="68" cy="170" r="10" fill="#9747ff" />
      <rect x="56" y="216" width="112" height="30" rx="8" fill="#9747ff" /><text x="112" y="235" text-anchor="middle" class="tx tx-strong tw">Button</text>
      <rect x="182" y="222" width="34" height="18" rx="9" fill="#9747ff" /><circle cx="207" cy="231" r="7" fill="#fff" />
    </g>
    <circle data-k="swRing" data-off cx="68" cy="170" r="13.5" fill="none" class="brs" stroke-width="2" />
    <g transform="translate(56 296)"><g data-k="publish">
      <rect width="168" height="30" rx="7" class="br" /><text x="84" y="19" text-anchor="middle" class="tx tx-strong tw">Publish…</text>
      <g data-k="published" data-off><rect width="168" height="30" rx="7" class="ok" /><use href="#i-check" x="46" y="5" width="20" height="20" class="icw" /><text x="68" y="19" class="tx tx-strong tw">Published</text></g>
    </g></g>

    <!-- Files using it -->
    <g transform="translate(400 50)">
      <rect width="200" height="140" rx="14" class="bg" filter="url(#lb-shadow)" />
      <text x="16" y="24" class="tx tx-strong t1">Website</text>
      <use href="#lb-preview-old" /><g data-k="webNew"><use href="#lb-preview-new" /></g>
      <g data-k="webBadge" data-off>
        <rect x="12" y="104" width="176" height="26" rx="6" class="sel" /><text x="20" y="121" class="tx-s tx-strong brt">Updates available</text>
        <g transform="translate(150 117)"><g data-k="webBtn"><rect x="-34" y="-9" width="66" height="18" rx="4" class="br" /><text x="-1" y="4" text-anchor="middle" class="tx-s tx-strong tw">Update all</text></g></g>
      </g>
    </g>
    <g transform="translate(400 230)">
      <rect width="200" height="140" rx="14" class="bg" filter="url(#lb-shadow)" />
      <text x="16" y="24" class="tx tx-strong t1">Mobile app</text>
      <use href="#lb-preview-old" /><g data-k="mobNew"><use href="#lb-preview-new" /></g>
      <g data-k="mobBadge" data-off>
        <rect x="12" y="104" width="176" height="26" rx="6" class="sel" /><text x="20" y="121" class="tx-s tx-strong brt">Updates available</text>
        <g transform="translate(150 117)"><g data-k="mobBtn"><rect x="-34" y="-9" width="66" height="18" rx="4" class="br" /><text x="-1" y="4" text-anchor="middle" class="tx-s tx-strong tw">Update all</text></g></g>
      </g>
    </g>
  </g>
  <g data-k="cur" style="transform: translate(330px, 390px)">
    <use href="#i-cursor" x="-2.5" y="-2.2" width="20" height="22" fill="#1e1e1e" />
  </g>
</svg>
</div>
