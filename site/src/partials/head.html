<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  /* Light on the first visit; the header's toggle keeps the choice (docs/site.md §2.1). Before the first paint. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("wecra-site-theme"); } catch (e) {}
    var root = document.documentElement;
    root.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    root.classList.add("js");
    if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1e1e1e");
  })();
</script>
