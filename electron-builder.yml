appId: net.burakkoc.designer
productName: DesignerV2
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# The trackpad's haptics addon (src/main/haptics.ts, docs/desktop.md §10.2 "Haptics"): loaded from Resources
extraResources:
  - from: native/haptics/haptics.node
    to: haptics.node
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.png
dmg:
  artifactName: ${productName}-${version}.${ext}
