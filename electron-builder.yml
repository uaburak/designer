appId: net.burakkoc.designer
# "Wecra" from 1.0.4 (Wecra.app, Wecra-<version>.dmg, Wecra-<version>-arm64-mac.zip, Wecra-Setup-<version>.exe, the msi);
# "Designer" from 1.0.0 to 1.0.3, "DesignerV2" before. An installed Designer.app updated in place keeps its folder name
# and shows "Wecra" (docs/desktop.md §12.7). userData and the keychain's "DesignerV2 Safe Storage" keep the old name (src/main/identity.ts),
# so does package.json's name; the appId, the publish feed and the MSI's upgradeCode never change.
productName: Wecra
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# Updates (docs/desktop.md §12.6): electron-updater reads latest-mac.yml / latest.yml from the latest GitHub release of
# uaburak/designer (public). This writes resources/app-update.yml; scripts/release.sh builds with --publish never and
# prints the `gh release create` that uploads the files.
publish:
  provider: github
  owner: uaburak
  repo: designer
  releaseType: release
# The trackpad's haptics addon (src/main/haptics.ts, docs/desktop.md §10.2 "Haptics"): macOS only, loaded from Resources
mac:
  # Developer ID, hardened runtime, notarized (docs/desktop.md §12.4): Squirrel.Mac installs an update only when its
  # signature matches the running app's, and Gatekeeper opens a downloaded copy without a warning. The same identity
  # as Glint's; only this one, never another found in the keychain.
  identity: "Bilal koç (Q6GDNC3V8B)"
  # Signs with the certificate's hash: codesign can't match the name's "ç" (build/sign.mjs)
  sign: ./build/sign.mjs
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # notarytool with the keychain profile in APPLE_KEYCHAIN_PROFILE (scripts/release.sh sets it: $NOTARY_PROFILE, else
  # glint-notary); without it electron-builder signs and skips notarization with a warning
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: "Wecra uses your microphone for audio conversations in shared files."
  extraResources:
    - from: native/haptics/haptics.node
      to: haptics.node
    # The sign-in sheet (ASWebAuthenticationSession; src/main/account/authSheet.ts, docs/desktop.md §18.6)
    - from: native/authsheet/authsheet.node
      to: authsheet.node
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64]
    # What Squirrel.Mac installs (latest-mac.yml points at it); the DMG is for the first install
    - target: zip
      arch: [arm64]
  icon: build/icon.png
dmg:
  artifactName: ${productName}-${version}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  # Built from a Mac without Wine: leave the .exe's icon / version resources alone
  signAndEditExecutable: false
  # Unsigned: no publisherName in app-update.yml, so electron-updater doesn't ask the NSIS update for a signature
  # (latest.yml's sha512 is still checked). The portable zip and the MSI never update themselves (updater.ts).
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
# The MSI (docs/desktop.md §12.5; Figma's Enterprise installer): `npm run dist:msi` — `--win msi` picks it, so it isn't in
# win.target (there `npm run dist:win` would build it too, and on a Mac electron-builder fetches Wine for WiX).
# WiX runs on Windows: build it there (or a windows-latest runner), not on the Mac.
msi:
  # Figma: "The MSI will install Figma in Program Files for all users of a machine"
  perMachine: true
  oneClick: true
  runAfterFinish: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Made once and never changed: Windows Installer upgrades in place by it
  upgradeCode: "0902E200-F98C-411C-8DD9-8793D7F6D960"
  artifactName: ${productName}-${version}-x64.${ext}
# Adds HKLM\SOFTWARE\DesignerV2\InstalledByMsi = 1 to the MSI's project (a future updater leaves MSI installs alone);
# the deployment keys themselves are the admin's (GPO / Intune), never the installer's
msiProjectCreated: ./build/msi/installedByMsi.mjs
