appId: net.burakkoc.designer
productName: DesignerV2
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
# The trackpad's haptics addon (src/main/haptics.ts, docs/desktop.md §10.2 "Haptics"): macOS only, loaded from Resources
mac:
  extraResources:
    - from: native/haptics/haptics.node
      to: haptics.node
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.png
dmg:
  artifactName: ${productName}-${version}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  # Built from a Mac without Wine: leave the .exe's icon / version resources alone
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
